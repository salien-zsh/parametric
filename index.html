    <script>
      // 首屏前解析主题，避免闪烁。
      (function () {
        var root = document.documentElement, t = 'system';
        try { t = localStorage.getItem('parametric:theme') || 'system'; } catch (e) {}
        var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = t;
        root.dataset.themeResolved = dark ? 'dark' : 'light';
      })();
    </script>
    <script>
      // 桌面版由 preload 注入本地 SDK 垫片，完全离线，不加载任何外部脚本。
      // 浏览器版仍按需加载 Puter SDK 与统计脚本（加载失败时 loadPuter 会自动降级）。
      if (!window.desktopAPI) {
        var s = document.createElement('script');
        s.src = 'https://js.puter.com/v2/';
        s.onerror = function () { window.__puterFailed = true; };
        document.head.appendChild(s);
        var a = document.createElement('script');
        a.async = true;
        a.src = 'https://plausible.io/js/pa-QfcEKlwntvJJ6OH6sc-As.js';
        document.head.appendChild(a);
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>

    <a class="skip-link" href="#main">跳转到图形区</a>
